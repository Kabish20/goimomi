# ==============================================================================
# Goimomi Holidays - Nginx Reverse Proxy Configuration
# Production Server: goimomi.com
# Path: /etc/nginx/sites-available/goimomi
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name goimomi.com www.goimomi.com;

    # Maximum file upload size (documents, media, visa uploads)
    client_max_body_size 50M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Dynamic database-backed pages need server-rendered metadata for social crawlers.
    # Django still returns the same React application HTML to the browser.
    location ~ ^/(holiday|visa/apply)/[^/]+/?$ {
        rewrite ^/(.*)/?$ /api/share/$1/ break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # 1. Frontend React (Vite SPA)
    location / {
        root /home/ubuntu/goimomi/goimomifrontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets built by Vite
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }
    }

    # 2. Django Backend REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # 3. Django Management / Admin Panel
    location /management/ {
        proxy_pass http://127.0.0.1:8000/management/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # 4. Payment Gateway Callbacks & Webhooks
    location /payment/ {
        proxy_pass http://127.0.0.1:8000/payment/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 5. Django Backend Static Files (Admin CSS/JS, Spectacular UI, etc.)
    location /static/ {
        alias /home/ubuntu/goimomi/goimomibackend/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 6. Django Uploaded Media Files (Package images, vehicle photos, pdf vouchers)
    location /media/ {
        alias /home/ubuntu/goimomi/goimomibackend/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Error logging
    error_log /var/log/nginx/goimomi_error.log warn;
    access_log /var/log/nginx/goimomi_access.log;
}
